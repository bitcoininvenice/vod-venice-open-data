name: Aggiornamento dati

# Rigenera i dataset statici dalle fonti ufficiali e apre una pull request da revisionare.
on:
  schedule:
    - cron: '0 4 * * 1' # ogni lunedì alle 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r pipeline/requirements-dev.txt

      - name: GTFS ACTV e simulazione
        working-directory: pipeline
        # se il GTFS scaricato non ha corse per i giorni simulati, la simulazione resta quella precedente
        run: |
          (python download_gtfs.py && python export_simulation_data.py) || echo "::warning::GTFS ACTV non aggiornato (download fallito o calendario non valido)"
      - name: Opere pubbliche, WiFi, qualità dell'aria, orario Alilaguna, dati OSM (telecamere, DAE, farmacie, fontanelle, POI), fibra AGCOM
        working-directory: pipeline
        # ogni fonte è indipendente: un errore non blocca l'aggiornamento delle altre
        run: |
          python import_opere_pubbliche.py || echo "::warning::opere pubbliche non aggiornate"
          python import_wifi_hotspots.py || echo "::warning::hotspot WiFi non aggiornati"
          python import_arpav_air.py || echo "::warning::qualità dell'aria non aggiornata"
          python import_osm_surveillance.py || echo "::warning::telecamere OSM non aggiornate"
          python import_osm_defibrillators.py || echo "::warning::defibrillatori OSM non aggiornati"
          python import_osm_pharmacies.py || echo "::warning::farmacie OSM non aggiornate"
          (python import_osm_fountains.py && python enrich_fountains.py) || echo "::warning::fontanelle OSM non aggiornate"
          python import_venice_tap_water.py || echo "::warning::fontanelle Venice Tap Water non aggiornate"
          python import_osm_poi.py || echo "::warning::POI OSM (colonnine, parcheggi, pozzi, alberi, ecocentri, biblioteche) non aggiornati"
          python import_osm_waterways.py || echo "::warning::briccole e canali OSM non aggiornati"
          python import_osm_parks.py || echo "::warning::parchi e giardini OSM non aggiornati"
          python import_osm_civici.py || echo "::warning::numeri civici OSM non aggiornati"
          python import_osm_walk.py || echo "::warning::rete pedonale OSM non aggiornata"
          python import_arpav_pollen.py || echo "::warning::pollini misurati ARPAV non aggiornati"
          python import_arpav_lagoon.py || echo "::warning::sonde ARPAV della laguna non aggiornate"
          python import_cruscotto_italia.py || echo "::warning::profilo dei comuni (Cruscotto Italia) non aggiornato"
          python import_bdap_opere.py || echo "::warning::opere pubbliche BDAP (Monitoraggio Opere Pubbliche) non aggiornate"
          python import_cciaa_turismo.py || echo "::warning::turismo e popolazione non aggiornati"
          python import_alilaguna_gtfs.py || echo "::warning::orario Alilaguna non aggiornato"
          python import_agcom_fiber.py || echo "::warning::copertura fibra AGCOM non aggiornata"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verifica che i nuovi dati non rompano l'app
        run: |
          npm run typecheck
          npm test
          npm run build

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data/refresh
          delete-branch: true
          commit-message: 'chore(data): aggiornamento automatico dei dataset'
          title: 'Aggiornamento automatico dei dataset'
          body: |
            Dataset rigenerati dalle fonti ufficiali dal workflow `refresh-data`:
            - simulazione GTFS ACTV e indice corse (`web/public/data/sim-<hash>.json`, `web/src/lib/simulation-data.ts`, `web/src/data/actv-gtfs-index.json`, fermate della mappa `web/src/data/actv-stops.json`)
            - opere pubbliche, hotspot WiFi (dati.venezia.it), qualità dell'aria (ARPAV)
            - orario Alilaguna (GTFS dell'operatore, `web/src/data/alilaguna-gtfs.json`)
            - copertura della rete fissa (AGCOM BroadbandMap, `web/src/data/agcom-fiber.json`)
            - profilo socio-economico dei comuni della laguna (Cruscotto Italia, AgID)
            - opere pubbliche del Comune dal Monitoraggio Opere Pubbliche (BDAP – Ragioneria Generale dello Stato)
            - pollini misurati ARPAV a Venezia, sonde ARPAV della laguna e riepilogo balneazione, turismo e popolazione dei comuni della laguna (Camera di Commercio)
            - OpenStreetMap: telecamere, DAE, farmacie, fontanelle, colonnine, parcheggi, vere da pozzo, alberi monumentali, ecocentri, biblioteche, briccole e canali, parchi e giardini, numeri civici, rete pedonale del planner (`web/public/data/walk-<hash>.json`, `web/src/lib/walk-data.ts`)

            Typecheck, test e build sono passati sui nuovi dati. Controllare il diff prima del merge.
          labels: data
