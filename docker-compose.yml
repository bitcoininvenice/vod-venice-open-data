services:
  db:
    image: postgis/postgis:16-3.4
    container_name: vod_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-venice_opendata}
      POSTGRES_USER: ${POSTGRES_USER:-vod_user}
      # Nessuna password di default: impostarla in .env (vedi .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Impostare POSTGRES_PASSWORD nel file .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Esposto solo sulla macchina locale, non sulla rete
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_init_postgis.sql:/docker-entrypoint-initdb.d/01_init_postgis.sql:ro
      - ./db/02_spatial_queries.sql:/docker-entrypoint-initdb.d/02_spatial_queries.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
